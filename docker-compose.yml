version: "3.7"

services:
  httpd:
    image: in2code/httpd:2.4-alpine
    environment:
      WEB_DOCUMENT_ROOT: /app/app/${WEBROOT}/
      VIRTUAL_HOST: ${HOST}
      VIRTUAL_PORT: 443
      VIRTUAL_PROTO: https
    working_dir: /app/app
    volumes:
      - ./:/app/:cached
    networks:
      default:
        aliases:
          - ${HOST}

  php:
    build:
      context: .project/docker/php/
      dockerfile: Dockerfile
    volumes:
      - ./:/app/:cached
      - $HOME/.composer/auth.json:/tmp/composer/auth.json
      - $HOME/.composer/cache/:/tmp/composer/cache/
      - $HOME/.gitconfig:/home/app/.gitconfig
      - $HOME/.ssh/:/home/app/.ssh/
    working_dir: /app/app
    env_file:
      - .env

  mysql:
    image: in2code/mysql:5.6
    env_file:
      - .env
    volumes:
      - mysql:/var/lib/mysql/
      - .data/dumps:/.data/dumps
    ports:
      - ${SQLPORT}:3306

volumes:
  mysql:
